
<style>
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Kalam:wght@300;400;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --chili:#c0392b;--herb:#3a6644;--saffron:#d4813a;--turmeric:#b8973a;
  --miso:#7a4f2a;--ink:#2b2118;--paper:#f7f2e8;--grid:#c9dce8;
  --margin:#e8a090;--muted:#9a856a;
}
.wrap{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  font-family:'Caveat',cursive;
  padding-bottom:40px;
}
.app-header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--paper);border-bottom:2px solid var(--ink);}
.logo-block{display:flex;align-items:center;gap:8px;}
.logo-sq{width:36px;height:36px;background:rgba(192,57,43,.1);border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-family:'Kalam',cursive;font-weight:700;font-size:16px;color:var(--chili);}
.app-name{font-family:'Kalam',cursive;font-weight:700;font-size:20px;color:var(--ink);}
.header-actions{display:flex;gap:8px;align-items:center;}
.hbtn{font-family:'Caveat',cursive;font-size:14px;font-weight:600;padding:4px 12px;border:2px solid var(--ink);background:transparent;cursor:pointer;color:var(--ink);}
.streak{font-family:'Kalam',cursive;font-size:13px;font-weight:700;padding:3px 9px;border:1.5px solid var(--chili);color:var(--chili);background:rgba(192,57,43,.08);}

.screen-label{font-family:'Kalam',cursive;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:2px;text-transform:uppercase;padding:10px 16px 4px;opacity:.7;}
.sec-label{font-family:'Kalam',cursive;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:2px;text-transform:uppercase;border-bottom:1.5px dashed #c8b89a;padding-bottom:3px;margin-bottom:10px;}
.tag{font-family:'Caveat',cursive;font-size:13px;font-weight:600;padding:2px 9px;border:1.5px solid var(--chili);color:var(--chili);background:rgba(192,57,43,.08);}
.herb-tag{border-color:var(--herb);color:var(--herb);background:rgba(58,102,68,.08);}
.annotation{font-family:'Caveat',cursive;font-size:13px;font-style:italic;color:#7a6249;}
.macro-pill{font-family:'Caveat',cursive;font-size:13px;font-weight:600;padding:2px 9px;border:1.5px solid var(--ink);color:var(--ink);}

.main-layout{padding:16px;}

.prefs-summary{background:rgba(255,255,255,.5);border:2px solid var(--ink);padding:12px 14px;margin-bottom:20px;transform:rotate(-0.4deg);position:relative;}
.prefs-summary::before{content:'';position:absolute;bottom:-3px;right:-3px;left:3px;top:3px;border:1.5px solid var(--ink);z-index:-1;opacity:.15;}
.prefs-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px;}

.spin-zone{display:flex;flex-direction:column;align-items:center;gap:14px;padding:8px 0 20px;}

/* WHEEL */
.wheel-container{position:relative;width:240px;height:240px;cursor:pointer;}
.wheel-container:hover .wsvg{filter:drop-shadow(0 0 8px rgba(192,57,43,0.3));transform:scale(1.02);}
.wsvg{transition:transform .3s,filter .3s;}
.w-pointer{position:absolute;top:-14px;left:50%;transform:translateX(-50%);z-index:10;}
.w-hub{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:44px;height:44px;background:var(--paper);border:3px solid var(--ink);
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:'Kalam',cursive;font-size:20px;font-weight:700;color:var(--chili);z-index:11;
}

.spin-btn{
  font-family:'Kalam',cursive;font-size:20px;font-weight:700;
  color:var(--paper);background:var(--ink);border:none;
  padding:10px 32px;cursor:pointer;transform:rotate(-1.2deg);
  position:relative;letter-spacing:.5px;
}
.spin-btn::before{content:'';position:absolute;inset:3px 3px -4px -4px;background:var(--chili);z-index:-1;}
.spin-btn:hover{transform:rotate(-1.2deg) translateY(-2px);}
.spin-btn:active{transform:rotate(-1.2deg) translateY(1px);}

.macro-bar{background:rgba(255,255,255,.5);border:2px solid var(--ink);padding:10px 14px;transform:rotate(-0.3deg);position:relative;margin-top:4px;}
.tracker-macro{font-family:'Kalam',cursive;font-size:14px;font-weight:700;color:var(--ink);}
.tracker-macro span{font-family:'Caveat',cursive;font-weight:400;font-size:12px;color:var(--muted);}
</style>

<div class="wrap">
  <div class="screen-label">Screen 3 — Main app with roulette wheel</div>

  <div class="app-header">
    <div class="logo-block">
      <div class="logo-sq">MR</div>
      <div class="app-name">Meal Roulette</div>
    </div>
    <div class="header-actions">
      <span class="streak">🔥 5</span>
      <button class="hbtn">History</button>
      <button class="hbtn">Edit prefs</button>
    </div>
  </div>

  <div class="main-layout">

    <div class="prefs-summary">
      <div class="sec-label">Current targets</div>
      <div class="prefs-row">
        <span class="macro-pill">P: 140g</span>
        <span class="macro-pill">C: 180g</span>
        <span class="macro-pill">F: 60g</span>
        <span class="macro-pill">≤ 500 kcal</span>
        <span class="macro-pill">≤ 30 min</span>
        <span class="tag herb-tag">Chicken</span>
        <span class="tag herb-tag">Broccoli</span>
        <span class="tag herb-tag">Rice</span>
      </div>
    </div>

    <div class="spin-zone">
      <div class="sec-label" style="align-self:flex-start;width:100%">Tonight's roulette</div>

      <!-- WHEEL -->
      <div class="wheel-container" id="wheelWrap" onclick="doSpin()">
        <svg class="w-pointer" width="24" height="28" viewBox="0 0 24 28">
          <polygon points="12,2 22,26 12,20 2,26" fill="#c0392b" stroke="#2b2118" stroke-width="2" stroke-linejoin="round"/>
        </svg>
        <svg class="wsvg" id="wSvg" width="240" height="240" viewBox="0 0 240 240">
          <circle cx="120" cy="120" r="112" fill="#f7f2e8" stroke="#2b2118" stroke-width="3"/>
          <!-- Segments — food palette -->
          <path d="M120,120 L120,8 A112,112 0 0,1 217,64 Z" fill="#c0392b" opacity="0.82" stroke="#2b2118" stroke-width="1.5"/>
          <path d="M120,120 L217,64 A112,112 0 0,1 232,176 Z" fill="#3a6644" opacity="0.78" stroke="#2b2118" stroke-width="1.5"/>
          <path d="M120,120 L232,176 A112,112 0 0,1 173,228 Z" fill="#d4813a" opacity="0.85" stroke="#2b2118" stroke-width="1.5"/>
          <path d="M120,120 L173,228 A112,112 0 0,1 67,228 Z" fill="#7a4f2a" opacity="0.75" stroke="#2b2118" stroke-width="1.5"/>
          <path d="M120,120 L67,228 A112,112 0 0,1 8,176 Z" fill="#b8973a" opacity="0.80" stroke="#2b2118" stroke-width="1.5"/>
          <path d="M120,120 L8,176 A112,112 0 0,1 23,64 Z" fill="#6a4a8a" opacity="0.70" stroke="#2b2118" stroke-width="1.5"/>
          <path d="M120,120 L23,64 A112,112 0 0,1 120,8 Z" fill="#c0392b" opacity="0.60" stroke="#2b2118" stroke-width="1.5"/>
          <!-- Dashed outer ring texture -->
          <circle cx="120" cy="120" r="110" fill="none" stroke="#2b2118" stroke-width="2" stroke-dasharray="3 4" opacity="0.25"/>
          <!-- Labels -->
          <text font-family="Kalam,cursive" font-weight="700" font-size="11" fill="#fff" transform="rotate(26,120,120)" text-anchor="middle" x="175" y="56">Italian</text>
          <text font-family="Kalam,cursive" font-weight="700" font-size="11" fill="#fff" transform="rotate(77,120,120)" text-anchor="middle" x="202" y="122">Thai</text>
          <text font-family="Kalam,cursive" font-weight="700" font-size="11" fill="#fff" transform="rotate(128,120,120)" text-anchor="middle" x="181" y="190">Mexican</text>
          <text font-family="Kalam,cursive" font-weight="700" font-size="11" fill="#fff" transform="rotate(180,120,120)" text-anchor="middle" x="120" y="218">Japanese</text>
          <text font-family="Kalam,cursive" font-weight="700" font-size="11" fill="#fff" transform="rotate(232,120,120)" text-anchor="middle" x="59" y="190">Indian</text>
          <text font-family="Kalam,cursive" font-weight="700" font-size="11" fill="#fff" transform="rotate(283,120,120)" text-anchor="middle" x="38" y="122">Greek</text>
          <text font-family="Kalam,cursive" font-weight="700" font-size="11" fill="#fff" transform="rotate(334,120,120)" text-anchor="middle" x="65" y="56">American</text>
        </svg>
        <div class="w-hub">?</div>
      </div>

      <button class="spin-btn" onclick="doSpin()">Spin It!</button>
      <div class="annotation">← click the wheel or tap the button</div>
    </div>

    <!-- Collapsed macro bar -->
    <div class="macro-bar">
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
        <div class="tracker-macro">P: 82g<span>/140g</span></div>
        <div class="tracker-macro">C: 95g<span>/180g</span></div>
        <div class="tracker-macro">F: 31g<span>/60g</span></div>
        <div class="tracker-macro">Cal: 980<span>/2000</span></div>
        <div style="margin-left:auto;font-family:'Kalam',cursive;font-size:13px;color:var(--chili);font-weight:700;">▼ expand</div>
      </div>
    </div>

  </div>
</div>

<script>
let rot=0,busy=false;
function doSpin(){
  if(busy)return;busy=true;
  const el=document.getElementById('wSvg');
  rot+=1080+Math.floor(Math.random()*360);
  el.style.transition='transform 1.9s cubic-bezier(0.25,0.1,0.08,1)';
  el.style.transform='rotate('+rot+'deg)';
  setTimeout(()=>{busy=false;},2000);
}
</script>
